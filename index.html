<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة النسبة المئوية | أداة مجانية</title>
<meta name="description" content="كل حسابات النسبة المئوية في مكان واحد: كم تساوي X٪ من Y، وX كم في المئة من Y، ونسبة الزيادة أو النقص. دون إرسال بيانات.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:1.6rem 1rem;text-align:center}
header h1{font-size:1.5rem}
.tagline{opacity:.92;font-size:.95rem;margin-top:.25rem}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:1rem}
.card h2{font-size:1.1rem;margin-bottom:.4rem;color:#0f766e}
label{display:block;font-weight:700;margin:.75rem 0 .3rem}
input,select,textarea{width:100%;padding:.7rem .8rem;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:#1e293b}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(20,184,166,.18)}
.row{display:flex;gap:.6rem}
.row>*{flex:1;min-width:0}
button{display:inline-block;width:100%;padding:.8rem;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:1rem}
button:hover{background:#115e59}
button.ghost{background:#e2e8f0;color:#1e293b}
.result{background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:10px;padding:1rem;margin-top:1rem;font-size:1.05rem;word-break:break-word}
.result b{color:#047857}
.result.warn{background:#fffbeb;border-color:#fcd34d}
.result.warn b{color:#b45309}
.result.bad{background:#fef2f2;border-color:#fca5a5}
.result.bad b{color:#b91c1c}
.muted{color:#64748b;font-size:.85rem}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.2rem 1rem;font-size:.85rem;line-height:1.9}
footer a{color:#5eead4}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
th,td{padding:.5rem;border-bottom:1px solid #e2e8f0;text-align:right;font-size:.95rem}
.big{font-size:1.6rem;font-weight:800}
.hidden{display:none}
.chk{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.chk input{width:auto}

</style>
</head>
<body>
<header>
<h1>حاسبة النسبة المئوية</h1>
<p class="tagline">ثلاث حاسبات في صفحة واحدة لكل أسئلة النسب</p>
</header>
<main>
<div class="card">
<h2>كم تساوي النسبة من رقم؟</h2>
<div class="row">
<div>
<label for="a1">النسبة ٪</label>
<input type="number" inputmode="decimal" id="a1" placeholder="15">
</div>
<div>
<label for="a2">من الرقم</label>
<input type="number" inputmode="decimal" id="a2" placeholder="200">
</div>
</div>
<button onclick="calcA()">احسب</button>
<div id="outA" class="result hidden"></div>
</div>
<div class="card">
<h2>رقم يمثل كم في المئة؟</h2>
<div class="row">
<div>
<label for="b1">الرقم</label>
<input type="number" inputmode="decimal" id="b1" placeholder="30">
</div>
<div>
<label for="b2">من</label>
<input type="number" inputmode="decimal" id="b2" placeholder="200">
</div>
</div>
<button class="ghost" onclick="calcB()">احسب</button>
<div id="outB" class="result hidden"></div>
</div>
<div class="card">
<h2>نسبة التغير بين قيمتين</h2>
<div class="row">
<div>
<label for="c1">من</label>
<input type="number" inputmode="decimal" id="c1" placeholder="100">
</div>
<div>
<label for="c2">إلى</label>
<input type="number" inputmode="decimal" id="c2" placeholder="125">
</div>
</div>
<button class="ghost" onclick="calcC()">احسب</button>
<div id="outC" class="result hidden"></div>
</div>

</main>
<footer>
<p>تعمل هذه الأداة بالكامل على جهازك، ولا تُحفظ أو تُرسل أي بيانات إلى أي خادم.</p>
<p>أداة مجانية مفتوحة المصدر · بُنيت بمساعدة أدوات ذكاء اصطناعي · <a href="https://github.com/abood-ayman/percentage-calculator-ar">الكود على GitHub</a></p>
</footer>
<script>
window.__jserrors=[];window.addEventListener('error',function(e){window.__jserrors.push(String(e.message))});
const g = id => document.getElementById(id);
const num = id => { const v = parseFloat(g(id).value); return isNaN(v) ? NaN : v; };
const r2 = x => Math.round(x * 100) / 100;
const fa = x => x.toLocaleString('ar-EG', { maximumFractionDigits: 2 });

function pctOf(p, y) { return p * y / 100; }
function whatPct(x, y) { return y === 0 ? NaN : x / y * 100; }
function pctChange(a, b) { return a === 0 ? NaN : (b - a) / Math.abs(a) * 100; }

function show(id, html) { const el = g(id); el.classList.remove('hidden'); el.innerHTML = html; }
function calcA() {
  const v = pctOf(num('a1'), num('a2'));
  show('outA', '<p class="big">الناتج: <b>' + fa(r2(v)) + '</b></p>');
}
function calcB() {
  const v = whatPct(num('b1'), num('b2'));
  show('outB', isNaN(v) || !isFinite(v) ? '<p>لا يمكن القسمة على صفر.</p>' : '<p class="big">النسبة: <b>' + fa(r2(v)) + '٪</b></p>');
}
function calcC() {
  const v = pctChange(num('c1'), num('c2'));
  const word = v >= 0 ? 'زيادة' : 'نقص';
  show('outC', isNaN(v) || !isFinite(v) ? '<p>لا يمكن الحساب من صفر.</p>' : '<p class="big">' + word + ' بنسبة: <b>' + fa(r2(Math.abs(v))) + '٪</b></p>');
}

window.__test = function () {
  const ok = Math.abs(pctOf(15, 200) - 30) < 0.001 &&
             Math.abs(whatPct(30, 200) - 15) < 0.001 &&
             Math.abs(pctChange(100, 125) - 25) < 0.001 &&
             Math.abs(pctChange(200, 150) + 25) < 0.001 &&
             isNaN(whatPct(5, 0));
  return { pass: ok, details: { a: pctOf(15, 200), b: whatPct(30, 200), c: pctChange(100, 125) } };
};

window.__demo = function () {
  g('a1').value = 15; g('a2').value = 200; calcA();
  g('b1').value = 30; g('b2').value = 200; calcB();
  g('c1').value = 4000; g('c2').value = 5000; calcC();
};

</script>
</body>
</html>
